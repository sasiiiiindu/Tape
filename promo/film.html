<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: SFD; src: url(SFD.ttf); font-weight: 1 1000; }
@font-face { font-family: SFS; src: url(SFS.ttf); font-weight: 1 1000; }
@font-face { font-family: SFT; src: url(SFT.ttf); font-weight: 1 1000; }
@font-face { font-family: SFR; src: url(SFNSRounded.ttf); font-weight: 1 1000; }
html,body { margin:0; background:#FBFBFD; }
canvas { display:block; }
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ---------- format ----------
// one film, two shapes: 16:9 by default, 9:16 for stories with film.html?vertical
const VERT = new URLSearchParams(location.search).has('vertical');
const FW = VERT ? 1080 : 1920, FH = VERT ? 1920 : 1080;

// ---------- palette (light column of DESIGN.md) ----------
const C = {
  bg: '#FBFBFD', panel: '#FFFFFF',
  focus: [210,65,47], brk: [42,132,88], long: [29,102,68],
  text: [29,29,31], sec: [84,84,89],
};
const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const mixc = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));

// ---------- maths ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
const eout = x => 1 - Math.pow(1 - x, 3);
const eout5 = x => 1 - Math.pow(1 - x, 5);
// fade in over [a,a+d], out over [b-d2,b]
const fio = (t, a, b, d = .7, d2 = .5) => eout(seg(t, a, a + d)) * (1 - eio(seg(t, b - d2, b)));

// ---------- session model ----------
const BLOCKS = [];
{ let m = 0; for (let r = 1; r <= 4; r++) {
    BLOCKS.push({ kind: 'focus', name: 'Focus ' + r, short: '' + r, start: m, end: m + 25, round: r }); m += 25;
    if (r < 4) { BLOCKS.push({ kind: 'brk', name: 'Break', short: '', start: m, end: m + 5, round: r }); m += 5; }
} }
const TOTAL = 115;
const colOf = k => k === 'focus' ? C.focus : k === 'long' ? C.long : C.brk;
const blockAt = T => BLOCKS.find(b => T >= b.start && T < b.end) || BLOCKS[BLOCKS.length - 1];
const WALL0 = 18 * 60 + 55; // 6:55 PM at minute 0
const clock = m => { m = Math.round(m) % 1440; let h = Math.floor(m / 60), mm = m % 60;
  const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${String(mm).padStart(2,'0')} ${ap}`; };
const mmss = mins => { const s = Math.max(0, Math.floor(mins * 60 + 1e-6)); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; };

// session time T(t) in minutes, integrated from a smooth rate curve
const FPS_INT = 600, DUR = 55;
const R = 0.645, RT = 1 / 60;
const TT = new Float64Array(DUR * FPS_INT + 2);
let T_CROSS = 0;
{ let T = 43;
  for (let i = 0; i < TT.length; i++) {
    const t = i / FPS_INT;
    TT[i] = T;
    let r;
    if (t < 1.8) r = 0;
    else if (t < 3.0) r = R * eio(seg(t, 1.8, 3.0));
    else if (t < 21.0) r = R;
    else r = lerp(R, RT, eio(seg(t, 21.0, 22.4)));
    T += r / FPS_INT;
    if (!T_CROSS && T >= 55) T_CROSS = t;
    if (t >= 42.9 && t - 1 / FPS_INT < 42.9) T += 20; // asleep for 20 minutes
  } }
const Tat = t => TT[clamp(Math.round(t * FPS_INT), 0, TT.length - 1)];

// ---------- canvas helpers ----------
const cv = document.getElementById('c'); cv.width = FW; cv.height = FH; const ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width = 1920; off.height = 600;
const ox = off.getContext('2d');
const lay = document.createElement('canvas'); lay.width = FW; lay.height = FH;
const lx = lay.getContext('2d');
let ICON = new Image(); ICON.src = 'icon-1024.png';
// each scene draws into its own layer so transitions can blur, scale and cross-fade it
const mkLayer = () => { const c = document.createElement('canvas'); c.width = FW; c.height = FH; return [c, c.getContext('2d')]; };
const LAYERS = {};
const layerFor = id => LAYERS[id] || (LAYERS[id] = mkLayer());
const TMP = mkLayer();
const clearLayer = (g, m) => { g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, FW, FH); g.globalAlpha = 1; g.filter = 'none'; if (m) g.setTransform(m); };
// film grain: a few seeded noise tiles, cycled so the grain lives without crawling
let SEED = 11; const rnd = () => { SEED = (SEED + 0x6D2B79F5) | 0; let x = Math.imul(SEED ^ SEED >>> 15, 1 | SEED); x ^= x + Math.imul(x ^ x >>> 7, 61 | x); return ((x ^ x >>> 14) >>> 0) / 4294967296; };
const GRAIN = [0, 1, 2, 3].map(() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); const im = g.createImageData(256, 256);
  for (let i = 0; i < im.data.length; i += 4) { const v = rnd() < .5 ? 0 : 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = rnd() * 24; }
  g.putImageData(im, 0, 0); return c; });
// settles with one small overshoot
const spring = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-6.5 * x) * Math.cos(10 * x);
// eased keyframes [[t, v], ...]
const keys = (t, K) => { if (t <= K[0][0]) return K[0][1];
  for (let i = 1; i < K.length; i++) if (t < K[i][0]) return lerp(K[i - 1][1], K[i][1], eio(seg(t, K[i - 1][0], K[i][0])));
  return K[K.length - 1][1]; };
let RATE = 0; // session seconds per real second, for the rolling digits

function rrect(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.roundRect(x, y, w, h, r); }
function text(g, str, x, y, { size = 20, weight = 400, fam = 'SFT', color = C.text, alpha = 1, align = 'left', base = 'alphabetic', track = 0 } = {}) {
  if (alpha <= 0) return;
  g.save(); g.font = `${weight} ${size}px ${fam}`; g.fillStyle = rgba(color, alpha);
  g.textAlign = align; g.textBaseline = base; g.letterSpacing = `${track}px`;
  g.fillText(str, x, y); g.restore();
}
function tw(g, str, size, weight = 400, fam = 'SFT', track = 0) { g.save(); g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = `${track}px`; const w = g.measureText(str).width; g.restore(); return w; }
// tabular digits: each digit in a fixed cell so the countdown never wobbles
// secs: pass the exact seconds left and digits roll like an odometer when they change slowly enough to see
function tab(g, str, x, y, size, weight, fam, color, alpha = 1, align = 'left', secs = null) {
  g.save(); g.font = `${weight} ${size}px ${fam}`; g.fillStyle = rgba(color, alpha); g.textBaseline = 'alphabetic'; g.textAlign = 'center';
  const dw = Math.max(...'0123456789'.split('').map(d => g.measureText(d).width));
  const cw = ch => ch === ':' ? g.measureText(':').width + size * .04 : dw;
  const W = [...str].reduce((s, ch) => s + cw(ch), 0);
  let cx = align === 'center' ? x - W / 2 : align === 'right' ? x - W : x;
  const P = [600, 60, 0, 10, 1]; // seconds per step of each character of "MM:SS"
  [...str].forEach((ch, i) => {
    const w = cw(ch), px = cx + w / 2, py = ch === ':' ? y - size * .04 : y;
    let rolled = false;
    if (secs !== null && P[i] && RATE > 0 && P[i] / RATE > .7) {
      const p = P[i], v = Math.floor(secs + 1e-6), n = p - 1 - v % p;
      const real = (n + v + 1 - secs) / RATE, RD = .34;
      const old = mmss((v + n + 1) / 60)[i];
      if (real < RD && old !== ch) {
        const e = eio(real / RD);
        // like SwiftUI's numeric text: the old digit sinks away and blurs out, the new one settles in from above
        const bl = size * .07;
        g.save(); g.filter = `blur(${(e * bl).toFixed(2)}px)`;
        g.fillStyle = rgba(color, alpha * (1 - eout(clamp(e * 1.4)))); g.fillText(old, px, py + size * .32 * e); g.restore();
        g.save(); g.filter = `blur(${((1 - e) * bl).toFixed(2)}px)`;
        g.fillStyle = rgba(color, alpha * eout(e)); g.fillText(ch, px, py - size * .32 * (1 - e));
        g.restore(); rolled = true;
      }
    }
    if (!rolled) g.fillText(ch, px, py);
    cx += w;
  });
  g.restore(); return W;
}

// headline: words (or letters) arrive one after another, rising and coming into focus
function caption(g, x, y, title, sub, t, a, b, { align = 'left', size = 88, weight = 300, fam = 'SFD', color = C.text, chars = false, stagger = .075 } = {}) {
  if (t < a || t > b) return;
  const track = -size * .008;
  const parts = chars ? [...title] : title.split(' ');
  const gap = chars ? 0 : tw(g, ' ', size, weight, fam, track);
  const ws = parts.map(p => tw(g, p, size, weight, fam, track));
  const W = ws.reduce((s, w) => s + w, 0) + gap * (parts.length - 1);
  let cx = align === 'center' ? x - W / 2 : align === 'right' ? x - W : x;
  const kout = eio(seg(t, b - .55, b));
  parts.forEach((p, i) => {
    const a0 = a + i * stagger;
    const kin = eout5(seg(t, a0, a0 + 1.1)), kf = eout(seg(t, a0, a0 + .75));
    const blur = (1 - kf) * size * .13 + kout * size * .09;
    g.save(); if (blur > .25) g.filter = `blur(${blur.toFixed(2)}px)`;
    text(g, p, cx, y + (1 - kin) * size * .26 - kout * size * .08, { size, weight, fam, color, alpha: kf * (1 - kout), track });
    g.restore();
    cx += ws[i] + gap;
  });
}

// ---------- the tape ----------
// x,y: top-left of window in px; s: px per pt; W: window width in pt; needle: needle x in pt
function drawTape(g, o) {
  const { x, y, s, W, needle, T, alpha = 1, reveal = null, deco = 1, needleK = 1 } = o;
  if (alpha <= 0) return;
  const H = 70, PPM = 7;
  ox.setTransform(1, 0, 0, 1, 0, 0); ox.clearRect(0, 0, off.width, off.height);
  ox.setTransform(s, 0, 0, s, 0, 0);
  const xm = m => needle + (m - T) * PPM;
  const m0 = Math.floor(T - needle / PPM) - 1, m1 = Math.ceil(T + (W - needle) / PPM) + 1;
  const cur = blockAt(T);
  // bands + labels
  for (const b of BLOCKS) {
    const bx0 = xm(b.start) + 2, bx1 = xm(b.end) - 2;
    if (bx1 < -10 || bx0 > W + 10) continue;
    const st = b.end <= T ? .25 : b === cur ? 1 : .6;
    ox.fillStyle = rgba(colOf(b.kind), st * deco);
    rrect(ox, bx0, 60, bx1 - bx0, 5, 2.5); ox.fill();
  }
  const labs = BLOCKS.map(b => ({ b, x: xm(b.start) + 2 }));
  labs.forEach((L, i) => {
    const next = labs[i + 1]; const room = next ? next.x - L.x - 4 : 1e9;
    let str = L.b.name; ox.font = '500 10px SFT';
    if (ox.measureText(str).width > room) str = L.b.short;
    if (!str || ox.measureText(str).width > room) return;
    ox.fillStyle = rgba(L.b === cur ? C.text : C.sec, deco * (L.b === cur ? 1 : .9));
    ox.fillText(str, L.x, 14);
  });
  // ticks
  for (let m = m0; m <= m1; m++) {
    if (m < 0 || m > TOTAL) continue;
    const tx = xm(m);
    const b = BLOCKS.find(b => m >= b.start && m < b.end) || BLOCKS[BLOCKS.length - 1];
    const boundary = BLOCKS.some(bb => bb.start === m) || m === TOTAL;
    const five = !boundary && (m - b.start) % 5 === 0;
    let h = boundary ? 30 : five ? 18 : 10;
    let op = m < T ? .22 : boundary ? .85 : five ? .95 : .5;
    let col = boundary ? C.text : colOf(b.kind);
    // ticks swell and brighten as they pass under the needle
    const near = Math.pow(Math.max(0, 1 - Math.abs(tx - needle) / 18), 2) * needleK;
    if (!boundary) { h *= 1 + .3 * near; op = lerp(op, 1, .6 * near); }
    let rk = 1;
    if (reveal) rk = reveal(tx);
    if (rk <= 0) continue;
    const hh = h * eout(rk);
    ox.fillStyle = rgba(col, op * rk);
    rrect(ox, tx - 1, 56 - hh, 2, hh, 1); ox.fill();
  }
  // edge fades (14% each side)
  ox.setTransform(1, 0, 0, 1, 0, 0);
  ox.globalCompositeOperation = 'destination-in';
  const gr = ox.createLinearGradient(0, 0, W * s, 0);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(.14, 'rgba(0,0,0,1)');
  gr.addColorStop(.86, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  ox.fillStyle = gr; ox.fillRect(0, 0, W * s, H * s + 4);
  ox.globalCompositeOperation = 'source-over';
  // needle (not faded)
  if (needleK > 0) {
    ox.setTransform(s, 0, 0, s, 0, 0);
    const drop = (1 - eout5(needleK)) * -26, grow = eout(clamp(needleK * 1.3 - .3));
    ox.fillStyle = rgba(C.text, clamp(needleK * 2));
    const top = 22 + drop;
    rrect(ox, needle - 1, top, 2, 38 * grow, 1); ox.fill();
    // a soft glow in the current block's colour around the needle head
    ox.save(); ox.shadowColor = rgba(colOf(cur.kind), .6 * clamp(needleK * 2)); ox.shadowBlur = 9 * s;
    ox.beginPath(); ox.arc(needle, top, 4, 0, Math.PI * 2); ox.fill(); ox.restore();
  }
  g.save(); g.globalAlpha *= alpha;
  g.drawImage(off, 0, 0, Math.ceil(W * s), Math.ceil(H * s + 4), x, y, Math.ceil(W * s), Math.ceil(H * s + 4));
  g.restore();
}

// ---------- the panel ----------
function drawPanel(g, px, py, s, T, k, alpha, tapeAlpha = 1, playing = true) {
  if (alpha <= 0 && tapeAlpha <= 0) return;
  // colour change dips through a soft neutral so coral and green never mix into brown
  const acc = mixc(mixc(C.focus, C.brk, k), [214,214,218], Math.sin(Math.PI * k) * .4);
  // labels roll like a counter: old one up and out, new one up from below, clipped to its row
  const e = eio(k);
  const roll = (a, b, x, y, h, opts, clip) => {
    if (e <= 0) { text(g, a, x, y, opts); return; }
    if (e >= 1) { text(g, b, x, y, opts); return; }
    g.save(); g.beginPath(); g.rect(clip[0], clip[1], clip[2], clip[3]); g.clip();
    text(g, a, x, y - h * e, { ...opts, alpha: 1 - e });
    text(g, b, x, y + h * (1 - e), { ...opts, alpha: e });
    g.restore();
  };
  const b = blockAt(T);
  g.save(); g.translate(px, py); g.scale(s, s);
  g.globalAlpha *= alpha;
  // card
  // layered shadow: a tight contact edge, a soft middle and a wide ambient lift
  const zs = Math.hypot(g.getTransform().a, g.getTransform().b);
  g.save(); g.fillStyle = C.panel;
  for (const [bl, oy, a] of [[1.5, .5, .07], [12, 4, .05], [44, 18, .09]]) {
    g.shadowColor = `rgba(24,24,48,${a})`; g.shadowBlur = bl * zs; g.shadowOffsetY = oy * zs;
    rrect(g, 0, 0, 320, 298, 14); g.fill();
  }
  g.restore();
  g.strokeStyle = 'rgba(0,0,0,0.07)'; g.lineWidth = .5; rrect(g, 0, 0, 320, 298, 14); g.stroke();
  // header
  g.fillStyle = rgba(acc); g.beginPath(); g.arc(24, 26, 4.5, 0, 7); g.fill();
  roll('Focus', 'Break', 36, 26, 16, { size: 13, weight: 600, base: 'middle' }, [30, 14, 120, 24]);
  text(g, `Round ${b.round} of 4`, 274, 26, { size: 12, color: C.sec, base: 'middle', align: 'right' });
  g.strokeStyle = rgba(C.sec); g.lineWidth = 1.2; g.lineCap = 'round';
  for (const [yy, kx] of [[22.5, 294], [29.5, 288]]) {
    g.beginPath(); g.moveTo(284, yy); g.lineTo(298, yy); g.stroke();
    g.fillStyle = C.panel; g.beginPath(); g.arc(kx, yy, 2.2, 0, 7); g.fill(); g.stroke();
  }
  // countdown
  const rem = b.end - T;
  tab(g, mmss(rem), 18, 104, 56, 300, 'SFR', C.text, 1, 'left', rem * 60);
  const nextName = b.kind === 'focus' ? 'break' : 'focus';
  if (k > 0 && k < 1 && b.kind === 'brk') {
    roll(`until break at ${clock(WALL0 + b.start)}`, `until focus at ${clock(WALL0 + b.end)}`, 20, 132, 16, { size: 13, color: C.sec }, [16, 119, 190, 18]);
  } else {
    const sub = b === BLOCKS[BLOCKS.length - 1] ? `until done at ${clock(WALL0 + TOTAL)}` : `until ${nextName} at ${clock(WALL0 + b.end)}`;
    text(g, sub, 20, 132, { size: 13, color: C.sec });
  }
  // restart
  g.fillStyle = 'rgba(0,0,0,0.06)'; g.beginPath(); g.arc(225, 94, 17, 0, 7); g.fill();
  g.strokeStyle = rgba(C.text); g.lineWidth = 1.6;
  g.beginPath(); g.arc(225, 94.5, 6, -Math.PI * .55, Math.PI * 1.25); g.stroke();
  g.fillStyle = rgba(C.text); g.beginPath();
  g.moveTo(221.2, 85.6); g.lineTo(226.6, 87.4); g.lineTo(222.0, 91.0); g.closePath(); g.fill();
  // play / pause
  g.fillStyle = rgba(acc); g.beginPath(); g.arc(276, 94, 24, 0, 7); g.fill();
  g.fillStyle = '#fff';
  if (playing) { rrect(g, 270.5, 86.5, 3.6, 15, 1.2); g.fill(); rrect(g, 278, 86.5, 3.6, 15, 1.2); g.fill(); }
  else { g.beginPath(); g.moveTo(272, 86); g.lineTo(284, 94); g.lineTo(272, 102); g.closePath(); g.fill(); }
  // divider + footer
  g.fillStyle = 'rgba(0,0,0,0.10)'; g.fillRect(20, 241, 280, 1);
  const s1 = 'Skip to break', s2 = 'Skip to focus';
  const bw = lerp(tw(g, s1, 13, 600), tw(g, s2, 13, 600), k) + 24;
  g.fillStyle = 'rgba(0,0,0,0.06)'; rrect(g, 20, 254, bw, 28, 8); g.fill();
  roll(s1, s2, 32, 268.5, 18, { size: 13, weight: 600, base: 'middle' }, [20, 254, bw, 28]);
  text(g, `Done at ${clock(WALL0 + TOTAL)}`, 300, 268.5, { size: 13, color: C.sec, base: 'middle', align: 'right' });
  g.restore();
}

// ---------- menu bar ----------
function drawMenuBar(g, T, alpha, slide) {
  if (alpha <= 0) return { sx: 0, sy: 0 };
  const m = 2, H = 24 * m, y = -H * (1 - slide);
  g.save(); g.globalAlpha *= alpha;
  g.fillStyle = 'rgba(255,255,255,0.6)'; g.fillRect(0, y, FW, H);
  g.fillStyle = 'rgba(0,0,0,0.06)'; g.fillRect(0, y + H, FW, 1);
  const cy = y + H / 2;
  // left: generic menus
  text(g, 'File', 56, cy, { size: 13 * m, weight: 500, base: 'middle', alpha: .9 });
  text(g, 'Edit', 56 + 70, cy, { size: 13 * m, weight: 500, base: 'middle', alpha: .9 });
  text(g, 'View', 56 + 140, cy, { size: 13 * m, weight: 500, base: 'middle', alpha: .9 });
  // right: clock
  const now = WALL0 + 60 + T - 55; // wall clock drifts with the session
  const clk = `Tue 20 Oct  ${clock(now)}`;
  text(g, clk, FW - 40, cy, { size: 13 * m, weight: 500, base: 'middle', align: 'right' });
  let rx = FW - 40 - tw(g, clk, 13 * m, 500) - 44;
  // status item: mini strip + countdown
  const b = blockAt(T);
  const cdW = tab(g, '00:00', -9999, 0, 13 * m, 500, 'SFT', C.text, 0);
  const itemR = rx, cdX = itemR - cdW;
  tab(g, mmss(b.end - T), cdX, cy + 4.5 * m, 13 * m, 500, 'SFT', C.text);
  const SW = 40 * m, SH = 4 * m, gap = 1.5 * m, sx = cdX - 6 * m - SW, sy = cy - SH / 2;
  const avail = SW - gap * (BLOCKS.length - 1);
  let bx = sx;
  for (const bb of BLOCKS) {
    const w = avail * (bb.end - bb.start) / TOTAL;
    g.fillStyle = 'rgba(0,0,0,0.25)'; rrect(g, bx, sy, w, SH, 2 * m); g.fill();
    const f = bb.end <= T ? 1 : bb === b ? (T - bb.start) / (bb.end - bb.start) : 0;
    if (f > 0) { g.save(); rrect(g, bx, sy, w, SH, 2 * m); g.clip(); g.fillStyle = rgba(colOf(bb.kind)); g.fillRect(bx, sy, w * f, SH); g.restore(); }
    bx += w + gap;
  }
  // highlight pill behind the item
  g.restore();
  return { sx, sy: cy, ex: itemR, H, y };
}

// ---------- settings preview ----------
function slotsAt(t) {
  const rk = eio(seg(t, 35.0, 36.1)), lk = eio(seg(t, 37.0, 38.1));
  const out = [];
  for (let r = 1; r <= 6; r++) {
    const pres = r <= 4 ? 1 : rk;
    out.push({ kind: 'focus', d: 25 * pres, p: pres });
    if (r < 6) {
      const presB = r <= 3 ? 1 : rk;
      const isLong = r === 2 || r === 4;
      const d = isLong ? lerp(5, 15, lk) : 5;
      out.push({ kind: isLong ? 'longmix' : 'brk', lk: isLong ? lk : 0, d: d * presB, p: presB });
    }
  }
  return out;
}
function drawSettings(g, t) {
  g.save();
  caption(g, FW / 2, VERT ? 560 : 330, 'Your own rhythm.', null, t, 31.8, 40.3, { align: 'center' });
  // values row
  const cols = [
    ['Focus', ['25 min'], []],
    ['Break', ['5 min'], []],
    ['Rounds', ['4', '6'], [35.0]],
    ['Long break', ['Off', 'Every 2'], [37.0]],
  ];
  // one row of four values, or a 2 x 2 grid when vertical
  const X0 = VERT ? 60 : 360, W = VERT ? 960 : 1200, ROWY = VERT ? 760 : 520;
  const LS = VERT ? 30 : 24, VS = VERT ? 72 : 52, VY = VERT ? 84 : 60, DY = VERT ? 30 : 22;
  cols.forEach(([lab, vals, at], i) => {
    const cx = VERT ? FW / 2 + (i % 2 - .5) * 440 : X0 + W * (i + .5) / 4;
    const ry = VERT ? ROWY + Math.floor(i / 2) * 220 : ROWY;
    const k0 = fio(t, 32.9 + i * .12, 99, .8);
    text(g, lab, cx, ry, { size: LS, fam: 'SFS', weight: 500, color: C.sec, align: 'center', alpha: k0 });
    vals.forEach((v, j) => {
      const inK = j === 0 ? 1 : eout5(seg(t, at[j - 1] + .2, at[j - 1] + .8));
      const outK = j + 1 < vals.length ? eio(seg(t, at[j], at[j] + .25)) : 0;
      const a = inK * (1 - outK) * k0;
      const dy = (1 - inK) * DY - outK * DY;
      text(g, v, cx, ry + VY + dy, { size: VS, weight: 300, fam: 'SFD', align: 'center', alpha: a, track: -.3 });
    });
  });
  // strip
  const S = 4, SY = VERT ? 1180 : 680, SH = 6 * S, GAP = 2 * S;
  const sl = slotsAt(t);
  const gaps = sl.reduce((s, x, i) => s + (i ? GAP * x.p : 0), 0);
  const sum = sl.reduce((s, x) => s + x.d, 0);
  g.save();
  let x = X0;
  sl.forEach((s0, i) => {
    if (i) x += GAP * s0.p;
    const w = (W - gaps) * s0.d / sum;
    const pop = i < 7 ? eout5(seg(t, 32.7 + i * .18, 33.3 + i * .18)) : 1;
    if (w > .5) {
      const col = s0.kind === 'focus' ? C.focus : s0.kind === 'brk' ? C.brk : mixc(C.brk, C.long, s0.lk);
      g.fillStyle = rgba(col, s0.p * pop); rrect(g, x, SY + SH * (1 - pop) * .5, Math.max(SH * pop, w * (.6 + .4 * pop)), SH * pop, SH / 2); g.fill();
    }
    x += w;
  });
  g.restore();
  // totals
  const totals = ['Total 1h 55m  ·  1h 40m focus', 'Total 2h 55m  ·  2h 30m focus', 'Total 3h 15m  ·  2h 30m focus'];
  const tAt = [35.0, 37.0];
  totals.forEach((str, j) => {
    const inK = j === 0 ? eout(seg(t, 33.6, 34.4)) : eout5(seg(t, tAt[j - 1] + .2, tAt[j - 1] + .8));
    const outK = j < 2 ? eio(seg(t, tAt[j], tAt[j] + .3)) : 0;
    text(g, str, FW / 2, SY + SH + (VERT ? 76 : 64) + (1 - inK) * 14, { size: VERT ? 34 : 28, fam: 'SFS', weight: 450, color: C.sec, align: 'center', alpha: inK * (1 - outK) });
  });
  g.restore();
}

// ---------- light ----------
// soft coloured light behind everything: coral while focusing, mint on a break, drifting slowly
function glow(g, x, y, r, c, a) {
  if (a <= .002) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, rgba(c, a)); gr.addColorStop(.45, rgba(c, a * .4)); gr.addColorStop(1, rgba(c, 0));
  g.fillStyle = gr; g.fillRect(0, 0, FW, FH);
}
function backdrop(g, t) {
  g.fillStyle = C.bg; g.fillRect(0, 0, FW, FH);
  const X = T_CROSS;
  const sF = keys(t, [[1.2, 0], [4.5, 1], [X, 1], [X + 1.4, 0], [31.2, 0], [33, .6], [39.4, .6], [40.6, 1], [46.4, 1], [48, .7]]);
  const sB = keys(t, [[X, 0], [X + 1.4, 1], [31.2, 1], [33, .6], [39.4, .6], [40.6, 0], [46.4, 0], [48, .55]]);
  const sC = keys(t, [[0, .4], [3, 1]]);
  const [f, b, c] = VERT ? [[300, 640], [800, 1380], [860, 160]] : [[560, 330], [1380, 760], [1520, 120]];
  glow(g, f[0] + 90 * Math.sin(t * .11), f[1] + 60 * Math.cos(t * .085), 1150, [240, 120, 96], .15 * sF);
  glow(g, b[0] + 90 * Math.cos(t * .1), b[1] + 50 * Math.sin(t * .09), 1150, [80, 190, 140], .15 * sB);
  glow(g, c[0] + 60 * Math.sin(t * .07), c[1], 900, [140, 160, 255], .07 * sC);
}
function finish(g, t) {
  const v = g.createRadialGradient(FW / 2, FH / 2, 520, FW / 2, FH / 2, 1280);
  v.addColorStop(0, 'rgba(20,20,48,0)'); v.addColorStop(1, 'rgba(20,20,48,0.08)');
  g.fillStyle = v; g.fillRect(0, 0, FW, FH);
  g.save(); g.globalAlpha = .5; g.fillStyle = g.createPattern(GRAIN[Math.floor(t * 24) % 4], 'repeat'); g.fillRect(0, 0, FW, FH); g.restore();
}

// ---------- camera ----------
// a scene draws into its own layer under a slow push-in; it comes into focus on the way in
// and pushes past the camera, blurring, on the way out
function shot(id, t, fn, { inA = null, inB = null, outA = null, outB = null, z = () => 1 } = {}) {
  const kin = inA === null ? 1 : eio(seg(t, inA, inB)), kout = outA === null ? 0 : eio(seg(t, outA, outB));
  if (kin <= 0 || kout >= 1) return;
  const zz = z(t) * lerp(.955, 1, eout(kin)) * lerp(1, 1.07, kout);
  const [c, g] = layerFor(id);
  clearLayer(g, new DOMMatrix([zz, 0, 0, zz, FW / 2 * (1 - zz), FH / 2 * (1 - zz)]));
  fn(g);
  const blur = (1 - kin) * 16 + kout * 20;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = kin * (1 - kout);
  if (blur > .3) ctx.filter = `blur(${blur.toFixed(2)}px)`;
  ctx.drawImage(c, 0, 0); ctx.restore();
}

// ---------- scenes ----------
function sceneHero(g, t, T) {
  const HS = VERT ? 3.2 : 3.6, HW = VERT ? 320 : 400;
  const hero = { x: FW / 2 - HW * HS / 2, y: FH / 2 - 35 * HS - (VERT ? 140 : 30), s: HS, W: HW, needle: HW / 2 };
  const [PS, PX, PY] = VERT ? [3.0, 60, 700] : [2.3, 1040, 197];
  const pan = { x: PX + 20 * PS, y: PY + 150 * PS, s: PS, W: 280, needle: 84 };
  const mk = eio(seg(t, 12.0, 13.5));
  const tp = {
    x: lerp(hero.x, pan.x, mk), y: lerp(hero.y, pan.y, mk), s: lerp(hero.s, pan.s, mk),
    W: lerp(hero.W, pan.W, mk), needle: lerp(hero.needle, pan.needle, mk), T,
    needleK: seg(t, .3, 1.3),
    reveal: t < 3.2 ? (tx => seg(t, 1.0 + Math.abs(tx - HW / 2) / HW * 1.6, 1.6 + Math.abs(tx - HW / 2) / HW * 1.6)) : null,
    deco: eout(seg(t, 2.0, 3.0)),
  };
  // the panel resolves out of a soft blur around the tape
  const pk = eout(seg(t, 13.0, 13.9));
  const k = eio(seg(t, T_CROSS, T_CROSS + .6));
  g.save(); if (pk > 0 && pk < 1) g.filter = `blur(${((1 - pk) * 14).toFixed(2)}px)`;
  drawPanel(g, PX, PY, PS, T, k, pk);
  g.restore();
  drawTape(g, tp);

  if (VERT) {
    caption(g, 540, 1170, 'Time, laid out.', null, t, 2.6, 5.6, { align: 'center' });
    caption(g, 540, 1170, 'Minutes, sliding', null, t, 6.0, 11.6, { align: 'center' });
    caption(g, 540, 1268, 'past a needle.', null, t, 6.15, 11.6, { align: 'center' });
  } else {
    caption(g, 960, 820, 'Time, laid out.', null, t, 2.6, 5.6, { align: 'center' });
    caption(g, 960, 820, 'Minutes, sliding past a needle.', null, t, 6.0, 11.6, { align: 'center' });
  }
  // two-line headlines beside the panel, or above it when vertical
  const [hx, hy] = VERT ? [64, 500] : [170, 520];
  caption(g, hx, hy, 'Everything,', null, t, 13.6, 20.9, { size: 80 });
  caption(g, hx, hy + 92, 'at a glance.', null, t, 13.85, 20.9, { size: 80 });
  caption(g, hx, hy, 'Focus.', null, t, 21.6, 25.8, { size: 80 });
  caption(g, hx, hy + 92, 'Then breathe.', null, t, 22.0, 25.8, { size: 80 });
}

// an original soft pastel desktop, so the menu bar has somewhere to live
function wallpaper(g, a, z) {
  if (a <= 0) return;
  g.save(); g.globalAlpha *= a;
  g.translate(FW / 2, FH / 2); g.scale(z, z); g.translate(-FW / 2, -FH / 2);
  const lg = g.createLinearGradient(0, 0, FW, FH);
  lg.addColorStop(0, 'rgb(253,241,234)'); lg.addColorStop(1, 'rgb(230,239,252)');
  g.fillStyle = lg; g.fillRect(-200, -200, FW + 400, FH + 400);
  const [a1, a2, a3] = VERT ? [[240, 420], [860, 1560], [820, 120]] : [[420, 260], [1560, 860], [1420, 120]];
  glow(g, a1[0], a1[1], 900, [250, 178, 152], .55);
  glow(g, a2[0], a2[1], 950, [150, 214, 188], .5);
  glow(g, a3[0], a3[1], 760, [196, 190, 250], .45);
  g.restore();
}

function sceneMenu(g, t, T) {
  const zk = eio(seg(t, 27.4, 29.4));
  const slide = eout5(seg(t, 25.9, 26.9));
  wallpaper(g, eout(seg(t, 25.9, 27.0)), lerp(1, 1.18, zk));
  const base = g.getTransform();
  // find status item position first (draw invisibly)
  g.save(); const info = drawMenuBar(g, T, 0.0001, 1); g.restore();
  const P = { x: (info.sx + info.ex) / 2, y: 24 };
  const Z = lerp(1, 3.6, zk);
  // vertical: sit a little left of centre so the clock's first word is whole, not cut mid-letter
  const Pd = { x: lerp(P.x, VERT ? FW / 2 - 110 : FW / 2, zk), y: lerp(P.y, VERT ? 760 : 360, zk) };
  g.save();
  g.translate(Pd.x, Pd.y); g.scale(Z, Z); g.translate(-P.x, -P.y);
  // the same panel glides up and shrinks into place under the status item
  const mv = eio(seg(t, 25.9, 27.0)), pout = eio(seg(t, 27.3, 27.9));
  const [PS, PX, PY] = VERT ? [3.0, 60, 700] : [2.3, 1040, 197]; // where the hero left the panel
  const ps = lerp(PS, 1.6, mv), ppx = lerp(PX, P.x - 160 * 1.6, mv), ppy = lerp(PY, 24 * 2 + 10, mv);
  if (1 - pout > 0) {
    const [tc, tg] = TMP;
    clearLayer(tg, g.getTransform());
    drawPanel(tg, ppx, ppy, ps, T, 1, 1);
    drawTape(tg, { x: ppx + 20 * ps, y: ppy + 150 * ps, s: ps, W: 280, needle: 84, T });
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1 - pout;
    if (pout > 0) g.filter = `blur(${(pout * 10).toFixed(2)}px)`;
    g.drawImage(tc, 0, 0); g.restore();
  }
  drawMenuBar(g, T, 1, slide);
  g.restore();
  if (VERT) {
    caption(g, 540, 1130, 'Lives in your', null, t, 28.6, 32.4, { align: 'center' });
    caption(g, 540, 1228, 'menu bar.', null, t, 28.8, 32.4, { align: 'center' });
  } else caption(g, 960, 720, 'Lives in your menu bar.', null, t, 28.6, 32.4, { align: 'center' });
}

function sceneExact(g, t, T) {
  // while the Mac sleeps the scene frosts over; it comes back sharp, already caught up
  const sk = eio(seg(t, 42.1, 42.7)) * (1 - eio(seg(t, 43.5, 44.2)));
  const [tc, tg] = TMP;
  const d = sk > 0 ? tg : g;
  if (sk > 0) clearLayer(tg, g.getTransform());
  const b = blockAt(T);
  const acc = b.kind === 'focus' ? C.focus : C.brk;
  const lab = b.kind === 'focus' ? 'Focus' : 'Break';
  // the vertical cut stacks the same column lower and a little larger, on a narrower tape
  const X = FW / 2, L = VERT ? { lab: 640, cd: 865, sub: 940, tape: 1010, TW: 300, ts: 36, cs: 220, asl: 940 }
                               : { lab: 208, cd: 380, sub: 440, tape: 500, TW: 360, ts: 30, cs: 168, asl: 480 };
  const lw = tw(d, lab, L.ts, 500, 'SFS');
  d.save(); d.shadowColor = rgba(acc, .6); d.shadowBlur = 14;
  d.fillStyle = rgba(acc); d.beginPath(); d.arc(X - lw / 2 - 18, L.lab, 9, 0, 7); d.fill(); d.restore();
  text(d, lab, X - lw / 2 + 4, L.lab, { size: L.ts, weight: 500, fam: 'SFS', base: 'middle' });
  tab(d, mmss(b.end - T), X, L.cd, L.cs, 300, 'SFR', C.text, 1, 'center', (b.end - T) * 60);
  const nextName = b.kind === 'focus' ? 'break' : 'focus';
  text(d, `until ${nextName} at ${clock(WALL0 + b.end)}`, X, L.sub, { size: L.ts, fam: 'SFS', color: C.sec, align: 'center' });
  drawTape(d, { x: X - L.TW * 3.4 / 2, y: L.tape, s: 3.4, W: L.TW, needle: L.TW / 2, T });
  if (sk > 0) {
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
    g.filter = `blur(${(sk * 28).toFixed(2)}px)`; g.globalAlpha = 1 - sk * .3; g.drawImage(tc, 0, 0);
    g.filter = 'none'; g.globalAlpha = 1; g.fillStyle = `rgba(250,250,252,${sk * .5})`; g.fillRect(0, 0, FW, FH);
    g.restore();
    const ak = eio(seg(sk, .85, 1));
    g.save(); if (ak < 1) g.filter = `blur(${((1 - ak) * 6).toFixed(2)}px)`;
    text(g, 'Asleep', X, L.asl, { size: VERT ? 64 : 52, weight: 300, fam: 'SFD', color: C.sec, align: 'center', alpha: ak, track: -.2 });
    text(g, '20 minutes later…', X, L.asl + (VERT ? 66 : 56), { size: VERT ? 34 : 28, fam: 'SFS', color: C.sec, align: 'center', alpha: ak * .8 });
    g.restore();
  }
  const cy = VERT ? 1440 : 860;
  caption(g, X, cy, 'Close the lid.', null, t, 40.8, 42.2, { align: 'center' });
  caption(g, X, cy, 'Open it. Still exact.', null, t, 44.3, 47.3, { align: 'center' });
}

function sceneEnd(g, t) {
  // the icon springs up out of a blur, then a band of light sweeps across it
  const x = seg(t, 47.1, 48.6), ik = eout(seg(t, 47.1, 47.7));
  const sc = lerp(.8, 1, spring(x)), IS = (VERT ? 360 : 300) * sc, cx = FW / 2, cy = VERT ? 760 : 360;
  if (ik > 0 && ICON.complete) {
    const [tc, tg] = TMP;
    clearLayer(tg, g.getTransform());
    tg.drawImage(ICON, cx - IS / 2, cy - IS / 2, IS, IS);
    const sw = eio(seg(t, 48.3, 49.4));
    if (sw > 0 && sw < 1) {
      tg.globalCompositeOperation = 'source-atop';
      const bx = lerp(cx - IS * 1.1, cx + IS * 1.1, sw);
      const sh = tg.createLinearGradient(bx - 90, cy - 160, bx + 90, cy + 160);
      sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(.5, 'rgba(255,255,255,0.26)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
      tg.fillStyle = sh; tg.fillRect(cx - IS, cy - IS, IS * 2, IS * 2);
      tg.globalCompositeOperation = 'source-over';
    }
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = ik;
    g.shadowColor = `rgba(24,24,48,${.22 * ik})`; g.shadowBlur = 60 * sc; g.shadowOffsetY = 26 * sc;
    if (ik < 1) g.filter = `blur(${((1 - ik) * 16).toFixed(2)}px)`;
    g.drawImage(tc, 0, 0); g.restore();
  }
  caption(g, cx, VERT ? 1120 : 660, 'Tape', null, t, 47.8, 99, { align: 'center', size: VERT ? 150 : 136, weight: 400, chars: true, stagger: .07 });
  caption(g, cx, VERT ? 1210 : 740, 'A calm Pomodoro timer for your Mac.', null, t, 48.6, 99, { align: 'center', size: VERT ? 40 : 34, weight: 400, fam: 'SFS', color: C.sec, stagger: .05 });
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  const T = Tat(t);
  RATE = Math.abs(T - Tat(t - .05)) * 60 / .05;
  backdrop(ctx, t);
  if (t < 25.9) shot('hero', t, g => sceneHero(g, t, T), { z: t => 1 + .035 * eio(seg(t, 0, 12)) * (1 - eio(seg(t, 11.8, 13.6))) });
  if (t >= 25.9 && t < 32.4) shot('menu', t, g => sceneMenu(g, t, T), { outA: 31.3, outB: 32.4 });
  if (t >= 31.5 && t < 40.4) shot('settings', t, g => drawSettings(g, t), { inA: 31.5, inB: 32.4, outA: 39.3, outB: 40.4, z: t => 1 + .025 * seg(t, 31.5, 40.4) });
  if (t >= 39.5 && t < 47.4) shot('exact', t, g => sceneExact(g, t, T), { inA: 39.5, inB: 40.5, outA: 46.4, outB: 47.4, z: t => 1 + .03 * seg(t, 39.5, 47.4) });
  if (t >= 46.9) shot('end', t, g => sceneEnd(g, t), { z: t => 1 + .02 * eout(seg(t, 47, DUR)) });
  finish(ctx, t);
}
window.render = render;
window.ready = Promise.all([document.fonts.load('300 56px SFR'), document.fonts.load('600 20px SFT'), document.fonts.load('300 20px SFD'), document.fonts.load('400 20px SFS'), new Promise(r => { if (ICON.complete) r(); else ICON.onload = r; })]);
window.ready.then(() => render(0));
</script></body></html>
